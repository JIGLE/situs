name: Verify (reusable)

# Shared lint/type-check/test trio, called by ci.yml on both PRs and pushes to main.
#
# It used to have a second caller, production.yml, which ran the identical trio plus an
# identical `next build` on the same `push: main` event — so every merge paid for two of
# everything. That workflow is gone; this stays reusable because the indirection costs
# nothing and the required-check names below depend on it.
#
# Job names match the required-status-check names in .github/BRANCH_PROTECTION.md —
# do not rename lint-type/test's `name:` without updating that config + doc together.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      # Validating that a manifest PARSES is not validating that GitHub ACCEPTS it. An
      # expression in an input `description` loads fine as YAML and then fails every job
      # using the action with "Unrecognized named-value". Nothing else in CI covers this.
      - name: Check composite action manifests
        run: python3 scripts/check-action-manifests.py

      - name: Type check
        run: npm run type-check

      # `hygiene` runs seven checkers. Six of them ran nowhere until this step existed: docs
      # reachability and retired claims, strict i18n parity, the colour and currency sweeps, the
      # Tailwind class contract, and package.json↔public/version.json sync. (The seventh, action
      # manifests, is the step above — hygiene re-runs it for milliseconds, which is cheaper than
      # decomposing the gate and letting the two lists drift.)
      #
      # CLAUDE.md said this already ran in CI because it sits inside `verify:ci` — but no workflow
      # invokes `verify:ci`, so those six passed or failed into the void. That is precisely the
      # "a checker nothing runs is not a checker" failure the hygiene rules exist to prevent,
      # reproduced on the checker that enforces them.
      - name: Repo hygiene
        run: npm run hygiene

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
