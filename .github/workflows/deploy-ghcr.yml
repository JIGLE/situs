name: Deploy to GHCR

on:
  push:
    # Two channels, and the distinction is the whole point of this file.
    #
    # A TAG is a release: it may claim `:<version>` and `:latest`.
    #
    # `main` is the development channel (below): it publishes `:main` and `:sha-<short>` and can
    # never claim a release name; see the tag-decision logic further down.
    tags: ["v*"]

  # `main` is the development channel, added because there was no path at all from "merged" to
  # "an image I can pull" without remembering to dispatch this workflow by hand.
  #
  # It starts when CI FINISHES on main, not when the merge lands. It used to be `push: branches:
  # [main]`, which ran beside CI rather than after it, so a commit whose CI failed was published as
  # `:main` all the same — on 2026-11-13 CI went red on main at 15:02 and this workflow pushed the
  # image from that commit nine minutes later. The `gate` job below only lets a successful CI run
  # of a push through, and builds the commit that run tested (`head_sha`), not whatever main
  # points at by the time this starts.
  #
  # `workflow_run` reads this file from the default branch, so editing this trigger on a branch
  # changes nothing until it merges; `workflow_dispatch` with `dry_run` is the way to test a build.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0) - defaults to package.json version"
        required: false
        default: ""
      platforms:
        description: "Build platforms"
        required: false
        default: "linux/amd64"
        type: choice
        options:
          - "linux/amd64"
          - "linux/amd64,linux/arm64"
      dry_run:
        description: "Dry run (no push to registry)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # A superseded DEVELOPMENT build may be cancelled — `:main` is a moving pointer and the newer
  # merge is the one anyone wants. A RELEASE may not: cancelling a tag build leaves `v1.25.0`
  # existing in git with no image behind it, and the next push will not retry it because the tag
  # already exists.
  #
  # This became load-bearing when `main` was added as a trigger. Before that, every run was its
  # own ref and nothing could ever cancel anything; now consecutive merges share
  # `deploy-refs/heads/main`. Tag refs still get their own group, so this expression is belt and
  # braces — it states the rule rather than relying on the grouping to imply it.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Decides whether a development build is due. A tag push or a manual dispatch always builds; a
  # finished CI run builds only when it was a push to main that succeeded and changed more than
  # docs. The docs check replaces the `paths-ignore` the old `push` trigger carried, which
  # `workflow_run` cannot express: a docs-only merge cannot change the image, so it should not
  # spend ten minutes rebuilding it.
  gate:
    name: Decide whether to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_run" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every commit on main is a merge or squash of one pull request, so its first parent is
          # the previous main and this diff is the whole merge.
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          echo "$CHANGED"
          CODE=$(grep -vE '^docs/|\.md$|^\.github/ISSUE_TEMPLATE/' <<<"$CHANGED" || true)
          if [ -z "$CODE" ]; then
            echo "Docs-only merge — the image cannot have changed; not rebuilding."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    # No `id-token` or `attestations`: nothing here calls an attestation action. The SBOM and
    # provenance below are BuildKit's own, pushed with the image under `packages: write`.
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      # The commit being built. For a CI-triggered build it is the commit CI tested; `github.sha`
      # there is the default branch's head when this run started, which may be a later merge.
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: contains(github.event.inputs.platforms || 'linux/amd64', 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      # No `driver-opts: image=moby/buildkit:latest` any more: every action here is pinned to a
      # commit, and that line pulled whatever BuildKit was newest into the job that holds
      # `packages: write`. The action's default is the stable BuildKit it was released with.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # ── Tagging policy ────────────────────────────────────────────────────────────────
      #
      # A bare version tag must mean the tagged source it was cut from, and `:latest` must
      # mean the newest release. Neither held before: every trigger produced
      # `:${VERSION},:latest`, and on a manual dispatch VERSION defaulted to whatever
      # package.json said.
      #
      # That is not hypothetical. On 2026-08-11 a dispatch from `main` published
      # `ghcr.io/jigle/situs:1.24.0` built from 43997fd, while git tag v1.24.0 points at
      # d03e4a7 — dozens of commits earlier. Two different images, one version number, and
      # `:latest` moved onto unreleased code at the same time.
      #
      # So: only a tag push may claim a version or `:latest`. A manual dispatch gets
      # `sha-<short>`, which cannot collide with anything and says exactly what it is —
      # unless an explicit pre-release `version` is supplied (one containing `-`, e.g.
      # 1.25.0-rc1), which is allowed to name itself because it can never be mistaken for a
      # release. Use `dry_run: true` to prove the image builds without publishing at all.
      - name: Set variables
        id: vars
        # Inputs reach the script as environment variables, never as `${{ }}` pasted into it: a
        # pasted value is shell source, so a `version` holding `$(…)` would run.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          IMAGE_NAME_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${BUILD_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # The only path that may claim a release identity.
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="ghcr.io/${IMAGE_NAME_LOWER}:${VERSION},ghcr.io/${IMAGE_NAME_LOWER}:latest"
          elif [[ -n "${INPUT_VERSION}" && "${INPUT_VERSION}" == *-* ]]; then
            # Explicit pre-release: self-identifying, so it may carry its own name. Still no :latest.
            VERSION="${INPUT_VERSION}"
            TAGS="ghcr.io/${IMAGE_NAME_LOWER}:${VERSION}"
          else
            # Everything else is a build of a commit, and is named after that commit.
            VERSION="sha-${SHORT_SHA}"
            TAGS="ghcr.io/${IMAGE_NAME_LOWER}:${VERSION}"

            # A merge to main whose CI passed additionally moves the development pointer, so "the
            # newest merge" has a stable name to pull. Still not `:latest` — that stays reachable
            # only from the tag branch above, which is what stops a test build becoming
            # production by accident. A manual dispatch never moves it, even from main: it did
            # not come through CI. Pulling `:main` requires the pull policy Always, or the cached
            # layer wins and the tag looks frozen (see docs/truenas.md).
            if [[ "${EVENT}" == "workflow_run" ]]; then
              TAGS="${TAGS},ghcr.io/${IMAGE_NAME_LOWER}:main"
            fi
            if [[ -n "${INPUT_VERSION}" ]]; then
              echo "::warning::Ignoring version='${INPUT_VERSION}' — a bare version number is reserved for tag pushes. Publishing ${VERSION} instead; pass a pre-release string like ${INPUT_VERSION}-rc1 to name it yourself."
            fi
          fi

          PLATFORMS="${INPUT_PLATFORMS:-linux/amd64}"
          DRY_RUN="${INPUT_DRY_RUN:-false}"
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "dry_run=${DRY_RUN}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "scan_tag=ghcr.io/${IMAGE_NAME_LOWER}:scan-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: Output image tags
        run: |
          echo "Target image tags: ${{ steps.vars.outputs.tags }}"

      # Build once into the local daemon so the image can be scanned BEFORE anything is
      # published. `load: true` cannot handle a multi-platform build, so this is pinned to
      # amd64 — the scan is about the base layer and OS packages, which do not differ
      # meaningfully across arches here. The push step below rebuilds for the real platform
      # list and hits the same gha cache, so this costs cache-warming, not a second build.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.vars.outputs.scan_tag }}
          build-args: |
            CACHE_BUST=${{ github.run_id }}-${{ github.run_number }}
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ env.BUILD_SHA }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `npm audit` covers the dependency tree; nothing covered the node:26-alpine base layer
      # and its OS packages, which is what actually ships. Run from the official Trivy image
      # pinned by DIGEST — a tag can be moved, a digest cannot, and this container is handed
      # the Docker socket.
      #
      # CRITICAL fails the job. HIGH is reported but does not block yet: the real number for
      # this base image has never been measured, and choosing a threshold before seeing it
      # would either wave everything through or block the first release for reasons nobody
      # has looked at. Tighten to `CRITICAL,HIGH` once the first run reports a number.
      - name: Scan image for vulnerabilities
        run: |
          set -euo pipefail
          TRIVY="aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c"
          IMAGE="${{ steps.vars.outputs.scan_tag }}"

          # The cache lives in runner.temp, NOT github.workspace, and that is load-bearing.
          # Docker creates the host side of this mount as root, and Trivy — root inside the
          # container — writes its BoltDB cache into `fanal/` with restrictive permissions. Put
          # that anywhere under the checkout and the NEXT step, which sends the same directory as
          # the build context under the unprivileged `runner` user, dies on it:
          #
          #   ERROR: failed to solve: error from sender: open .trivycache/fanal: permission denied
          #
          # That is not hypothetical — it broke every deploy between 2026-08-12 and 2026-08-14,
          # and the error names Trivy nowhere near the step that caused it. The cache only has to
          # outlive the two run_trivy calls below so the second reuses the vulnerability DB the
          # first downloaded; nothing persists across runs, so a temp path costs nothing.
          run_trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ runner.temp }}/.trivycache:/root/.cache/trivy" \
              "$TRIVY" image --scanners vuln "$@"
          }

          echo "::group::Trivy report (all severities from HIGH up)"
          run_trivy --severity HIGH,CRITICAL --format table "$IMAGE"
          echo "::endgroup::"

          # Second pass decides the gate. --exit-code 1 with CRITICAL only.
          if ! run_trivy --severity CRITICAL --exit-code 1 --format table --quiet "$IMAGE"; then
            echo "::error::Trivy found CRITICAL vulnerabilities in the image — not publishing"
            exit 1
          fi
          echo "No CRITICAL vulnerabilities found."

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ steps.vars.outputs.platforms }}
          push: ${{ steps.vars.outputs.dry_run != 'true' }}
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Situs
            org.opencontainers.image.description=Sovereign Capital System — property income, receipts and tax evidence
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}
            org.opencontainers.image.created=${{ steps.vars.outputs.build_time }}
          build-args: |
            CACHE_BUST=${{ github.run_id }}-${{ github.run_number }}
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ env.BUILD_SHA }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.vars.outputs.dry_run }}" == "true" ]]; then
            echo "✅ **Status**: Dry run completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Status**: Successfully deployed to GHCR" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.vars.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: ${{ steps.vars.outputs.platforms }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name_lower }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name_lower }}:${{ steps.vars.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
