name: CI

on:
  # `types` is spelled out because of `labeled`. The default set is
  # `opened, synchronize, reopened`, and the `e2e` job below is gated on a `run-e2e` label — so
  # with the default set, applying that label does nothing at all. The only way to reach E2E was
  # to label the PR *before* its final push and have `synchronize` notice, which nobody does and
  # nothing documents. The label did not even exist in the repository until this commit created
  # it, which is the tell: the job has reported `skipped` on every pull request it has ever run
  # against.
  #
  # Same family as the six overlay primitives in this PR that shipped Tailwind classes matching
  # no utility, and the seven `scripts/check-*` nothing invoked. A gate that cannot fire looks
  # exactly like a gate that passes.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E after build (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

# Cancel superseded runs on a PR branch — that is what this is for. Do NOT cancel on `main`:
# every commit there is a thing that can be tagged and shipped, so a cancelled run is a commit
# that shipped unverified. This already happened: runs #540 and #541 were cancelled when three
# Dependabot PRs merged ~20 seconds apart, leaving two commits on main with no CI at all. The
# workflows that survived that day (Release, Production Gate) survived only because they set
# cancel-in-progress: false.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  # ── Shared lint/type-check/test trio — see reusable-verify.yml ──
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    permissions:
      contents: read

  # ── Build runs alongside verify, not after it ──
  #
  # This job does its own checkout and `npm ci`; it consumed nothing from `verify`, so the old
  # `needs: verify` was a gate rather than a data dependency — and an expensive one. Build sat
  # idle for the length of the unit suite (146s vs its own 83s in the run that prompted this),
  # so a build failure took ~229s to surface instead of ~83s.
  #
  # That matters because `next build` catches a class of error nothing else here does: type-check,
  # lint and Vitest none of them bundle for a browser, which is how a client component importing
  # its way to better-sqlite3 stayed green for four commits.
  #
  # The gate itself is not lost — it moves to `smoke` below, so the expensive Playwright jobs
  # still refuse to start when lint or tests fail. What this trades is ~83s of runner time on a
  # PR whose tests fail, in exchange for build feedback arriving ~2.5 minutes sooner on every PR.
  build:
    name: Build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: file:./ci-build.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          # No demo-login flag at build time any more. The sign-in page resolves it on the server
          # per request and passes it to the form, so ENABLE_DEMO_LOGIN on the jobs that run the
          # app is sufficient and a build artifact carries no baked-in demo state.

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: .next/
          include-hidden-files: true
          retention-days: 1

  smoke:
    name: Smoke test (start built app)
    runs-on: ubuntu-latest
    # Both, deliberately. `build` is the data dependency (this job downloads its artifact);
    # `verify` is the cost gate that used to sit in front of `build`. Everything downstream of
    # smoke is Playwright, so keeping verify here is what stops a PR with failing unit tests
    # spending several minutes of runner time on browser jobs that were never going to be read.
    needs: [build, verify]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # Was `npm ci --ignore-scripts`, which skips `prisma generate`. The app under test is the
      # standalone build (it carries its own client), but the schema step below runs the Prisma
      # CLI from this tree, so the full install is the honest one.
      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      - uses: ./.github/actions/start-app
        with:
          database-url: file:${{ github.workspace }}/ci-smoke.db

      - name: Smoke check
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::App returned HTTP $HTTP_STATUS"
            cat app.log
            exit 1
          fi

      - name: Health check
        run: |
          curl -fS http://localhost:3000/api/ready || (cat app.log && exit 1)

      # `/` and `/api/ready` are the two paths that deliberately avoid the database — /api/ready
      # is documented in the Dockerfile as DB-free on purpose — so until now this job proved
      # only that Node started. It booted against a `ci-smoke.db` no step created, and
      # `getPrismaClient()` (lib/services/database/database.ts:26) throws outright when the file
      # is absent, so every data route was answering 500 while the job went green.
      #
      # /api/monitoring/health is the right probe: it runs `SELECT 1` through Prisma and needs
      # no session. Assert the field, not just the status — a 200 carrying `"unknown"` would
      # otherwise pass.
      - name: Database connectivity check
        run: |
          BODY=$(curl -sS -w '\n%{http_code}' http://localhost:3000/api/monitoring/health)
          HTTP_STATUS=$(tail -n1 <<<"$BODY")
          JSON=$(sed '$d' <<<"$BODY")
          echo "$JSON"
          DB=$(jq -r '.checks.database' <<<"$JSON")
          if [ "$HTTP_STATUS" != "200" ] || [ "$DB" != "healthy" ]; then
            echo "::error::Health check failed — HTTP $HTTP_STATUS, database='$DB'"
            cat app.log
            exit 1
          fi

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'

  e2e-smoke:
    name: E2E Smoke (required on PR)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      # demo-login is needed even though every test in smoke.spec.ts is unauthenticated: both
      # Playwright projects declare `dependencies: ["setup"]`, so `auth.setup.ts` runs here too,
      # and it now fails loudly instead of silently writing an empty session. demo-mode stays
      # off and nothing is seeded — this job must keep a signed-out `request` fixture, because
      # one of its tests asserts that unauthenticated API calls never return data.
      - uses: ./.github/actions/start-app
        with:
          database-url: file:${{ github.workspace }}/e2e-smoke.db
          nextauth-secret: e2e-test-secret-minimum-32-characters
          demo-login: "true"

      - name: Run Playwright smoke tests
        run: npx playwright test e2e/smoke.spec.ts --project=chromium
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-smoke.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters

      - name: Upload Playwright smoke report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 45
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true') ||
      (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'run-e2e'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      # demo-mode additionally opens /api/debug/db/seed so the suite has records to act on; the
      # delete-confirmation specs skip themselves against an empty database.
      - uses: ./.github/actions/start-app
        with:
          database-url: file:${{ github.workspace }}/e2e-test.db
          nextauth-secret: e2e-test-secret-minimum-32-characters
          demo-mode: "true"
          demo-login: "true"
          disable-rate-limit: "true"

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-test.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters
          # Opt in to seeding. `seedDemoData` deletes and recreates the demo user's records, so
          # `auth.setup.ts` only runs it when asked — never against a developer's dev.db.
          E2E_SEED: "true"

      # The mobile-chrome project (Pixel 5) was defined in playwright.config.ts but had never
      # executed anywhere — both jobs hardcoded --project=chromium, and the runner itself was
      # not running test bodies. Its first real run reported `90 passed (1.1m)` in CI, matching
      # chromium exactly, and caught one genuine defect the desktop project could not see: the
      # Settings mobile section picker had no accessible name, so the only way to navigate
      # Settings on a phone was anonymous to a screen reader.
      #
      # No longer advisory. A regression at phone width now fails the job.
      - name: Run Playwright tests (mobile viewport)
        run: npx playwright test --project=mobile-chrome
        env:
          DATABASE_URL: file:${{ github.workspace }}/e2e-test.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters
          # Re-seed rather than inherit the chromium step's state. The seed is idempotent, and
          # this step should not silently depend on the one above having run first.
          E2E_SEED: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'

  mobile-audit:
    name: Mobile Audit (390px responsive violations)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 30
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build
          path: .next/

      - uses: ./.github/actions/start-app
        with:
          database-url: file:${{ github.workspace }}/mobile-audit.db
          nextauth-secret: mobile-audit-secret-minimum-32-characters
          demo-mode: "true"
          demo-login: "true"

      # `--seed` is not optional: without it the harness walks a bare database, and a table with
      # no rows cannot overflow. Every number this job produced before it was added described
      # empty screens. `--strict` ratchets against BASELINE in the harness.
      #
      # This is a real gate now. CI reported `✓ Mobile audit exactly at baseline` on a seeded
      # 52-surface run — pageOverflow 0, touchTargetFails 4, touchTargetWarns 4,
      # clippedContainers 6, smallText 310 — matching three consecutive local runs against a
      # production standalone build and a fresh database. `continue-on-error` was the only
      # thing keeping an unmeasured baseline from blocking a PR, and the baseline is now
      # measured, so it comes off.
      #
      # If this fails: read the numbers before touching BASELINE. It may only ever go down.
      - name: Run mobile audit harness
        run: node scripts/mobile-audit.mjs --seed --strict
        env:
          AUDIT_BASE_URL: http://localhost:3000
          CI: "true"

      # Desktop, in the longest locale. Two blind spots this closes, both found by running it:
      # the harness only ever measured 390px, and it only ever measured `/en` — the shortest of
      # the four catalogues, so nav and tab bars were always being judged on their best case.
      # A first PT desktop pass found a separator clipping on all 44 owner-facing surface-runs.
      #
      # Advisory for now (`continue-on-error`) because it has no ratchet of its own yet; the
      # 390px run above stays the blocking gate. Give this one a BASELINE before removing that.
      - name: Run desktop audit harness (pt)
        run: node scripts/mobile-audit.mjs --locale pt --width 1440 --height 900
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Parse and report audit violations
        if: always()
        run: |
          set -euo pipefail
          REPORT=audit-report/report-390.json

          # A harness that crashed is not the same as a harness that found violations. Both now
          # fail the job, but they are different failures and the summary must say which: a
          # regression is a design backlog item, a harness that never started is a broken gate.
          # This step runs with `if: always()` so it still reports when the harness exits
          # non-zero. It used to exit 0 on a missing report, which is how the job stayed green
          # while the harness died at browser launch on every run.
          if [ ! -f "$REPORT" ]; then
            echo "## ❌ Mobile audit did not run" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The harness exited before writing \`$REPORT\`. This is a broken gate, not a" >> $GITHUB_STEP_SUMMARY
            echo "responsive-design regression — check the harness logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Read the harness's own pre-aggregated `summary` object. The previous version of this
          # step reduced over a `.surfaces[]` array that has never existed on this report (the
          # root keys are meta/summary/results), so every query yielded nothing and `|| echo 0`
          # turned that into a clean bill of health. `-e` makes a missing key fail the step
          # instead of silently printing a zero.
          jq -e '.summary' "$REPORT" > /dev/null

          SEEDED=$(jq -r '.meta.seeded' "$REPORT")
          read -r RUNS FAILED OVERFLOW TFAIL TWARN CLIPPED SMALLTEXT < <(
            jq -r '.summary | "\(.surfaceRuns) \(.failedToLoad) \(.pageOverflow) \(.touchTargetFails) \(.touchTargetWarns) \(.clippedContainers) \(.smallText)"' "$REPORT"
          )

          {
            echo "## 📱 Mobile Audit Report (390×844)"
            echo ""
            echo "Scanned **$RUNS surface-runs** (each surface in both themes) · seeded: \`$SEEDED\`"
            [ "$SEEDED" = "true" ] || echo ""
            [ "$SEEDED" = "true" ] || echo "> ⚠️ Unseeded run — these counts describe empty screens and mean little."
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Surfaces failing to load | $FAILED |"
            echo "| **Surface-runs with page-level horizontal overflow** | **$OVERFLOW** |"
            echo "| Touch targets under 24px (WCAG 2.2 AA fail) | $TFAIL |"
            echo "| Touch targets under 44px | $TWARN |"
            echo "| Containers clipping content (unreachable) | $CLIPPED |"
            echo "| Text under 12px | $SMALLTEXT |"
            echo ""
            echo "See \`audit-report/report-390.md\` in the artifact for the per-surface breakdown."
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload mobile audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-audit-report
          path: audit-report/
          retention-days: 7

      - name: Dump app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No app log found'
