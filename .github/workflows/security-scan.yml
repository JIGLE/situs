name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Default permissions for every job here. Without this block the jobs inherit the repository
# default, which can be read/write on all scopes — a scanning workflow is the last place that
# should hold write tokens. The two jobs that genuinely need more declare their own.
permissions:
  contents: read

# See ci.yml: cancel superseded PR runs, never cancel on `main`. A cancelled security scan on
# main is a commit whose dependencies, secrets and CodeQL results were never checked.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm audit` exits non-zero whenever it finds anything, so `|| true` is correct here —
      # the severity decision belongs to the next step. No `continue-on-error`: that applied to
      # the step whose only job was writing a file, and it hid the case where the file was
      # never written.
      - name: Run npm audit
        id: npm-audit
        run: npm audit --json > audit-report.json || true

      - name: Check audit results
        run: |
          set -euo pipefail

          # A missing report is a broken gate, not a clean bill of health. This used to
          # `exit 0` here, so an audit that crashed before writing anything read exactly like
          # an audit that found nothing.
          if [ ! -f audit-report.json ]; then
            echo "::error::npm audit produced no report — the scan did not run"
            exit 1
          fi

          # `-e` so a malformed report fails loudly instead of `// 0` turning a missing key
          # into a zero.
          jq -e '.metadata.vulnerabilities' audit-report.json > /dev/null

          VULNERABILITIES=$(jq -r '.metadata.vulnerabilities.total // 0' audit-report.json)
          CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' audit-report.json)

          # There is deliberately no package allowlist here. There was one — find-my-way,
          # @prisma/dev, prisma, for GHSA-c96f-x56v-gq3h — and it outlived the advisory it was
          # written for: an `overrides` entry fixed find-my-way, after which the list matched
          # nothing and nobody noticed. It then did active harm. When the deepmerge-ts advisory
          # landed in prisma's config loader it produced three findings, and `prisma` being on
          # this list swallowed one of them silently; the job failed only because the other two
          # package names happened not to be listed.
          #
          # An advisory that is genuinely not exploitable here gets fixed in `overrides` in
          # package.json, where the fix is visible in the dependency tree and expires on its own.
          # This step just counts. It also keeps this job in agreement with Custom Security Scan,
          # which runs scripts/security-scan.js — that has no allowlist, so any list here makes
          # two jobs apply different rules to the same audit data.
          HIGH=$(jq '[.vulnerabilities[] | select(.severity == "high")] | length' audit-report.json)

          echo "Total vulnerabilities: $VULNERABILITIES"
          echo "Critical: $CRITICAL"
          echo "High: $HIGH"

          # Fail on critical or high vulnerabilities
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical severity vulnerabilities"
            exit 1
          fi
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::Found $HIGH high severity vulnerabilities — run 'npm audit' locally to review"
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 14
          if-no-files-found: ignore

  security-scan:
    name: Custom Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `continue-on-error` stays only so the report is uploaded before the gate below runs —
      # the scanner's own exit code is re-derived from the report, not discarded. Previously
      # this swallowed the exit code for good: scripts/security-scan.js exits 1 on
      # `critical + high`, but the check step below only looked at `critical`, so every HIGH
      # finding the scanner raised was thrown away silently.
      - name: Run security scan
        id: security-scan
        run: node scripts/security-scan.js
        continue-on-error: true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: security-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Check scan results
        run: |
          set -euo pipefail

          # The scanner writes its report before exiting, so a missing file means it died
          # early. That is a broken gate and must not read as "found no issues" — which is
          # exactly what the previous `else` branch reported, with exit 0.
          if [ ! -f security-report.json ]; then
            echo "::error::scripts/security-scan.js produced no report — the scan did not run"
            exit 1
          fi

          jq -e '.summary' security-report.json > /dev/null
          CRITICAL=$(jq -r '.summary.critical // 0' security-report.json)
          HIGH=$(jq -r '.summary.high // 0' security-report.json)

          echo "Critical issues: $CRITICAL"
          echo "High issues:     $HIGH"

          # Gate on both, matching what the scanner itself decides to fail on.
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical and $HIGH high security issues"
            exit 1
          fi

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Code scanning is free on public repositories (this repo is public) — no GitHub
    # Advanced Security required. This is a real gate: a failed analysis fails the job,
    # and findings are uploaded to the Security tab (Settings → Code security).
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: ${{ matrix.language }}
          # JS/TS is interpreted — no build needed; build-mode: none is faster and avoids
          # flaky autobuild now that this job is no longer continue-on-error.
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Dependency review is free on public repositories — no GitHub Advanced Security
    # required. Gates on critical-severity introductions (fail-on-severity below).

    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
          deny-licenses: GPL-2.0, GPL-3.0

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        uses: ./.github/actions/resolve-scan-base

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          path: ./
          base: ${{ steps.base.outputs.base }}
          head: HEAD
          extra_args: --only-verified

  # Advisory scan: catches revoked/non-verifiable secrets that --only-verified misses.
  # Always passes (exit 0) — findings appear as a Step Summary warning for manual review.
  secret-scanning-unverified:
    name: Secret Scanning (Unverified — Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        uses: ./.github/actions/resolve-scan-base

      - name: TruffleHog Unverified Scan
        id: trufflehog-unverified
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          path: ./
          base: ${{ steps.base.outputs.base }}
          head: HEAD
          extra_args: --json --no-verification
        continue-on-error: true

      - name: Warn on unverified findings
        if: steps.trufflehog-unverified.outcome == 'failure'
        run: |
          echo "## Advisory: Unverified secrets detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "TruffleHog found potential (unverified) secrets. These may be false positives," >> $GITHUB_STEP_SUMMARY
          echo "revoked credentials, or internal tokens that need manual review." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run \`trufflehog git file://. --no-verification\` locally to inspect findings." >> $GITHUB_STEP_SUMMARY
          echo "::warning::Unverified secrets detected — manual review recommended"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, security-scan, codeql-analysis]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL Analysis: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f npm-audit-report/audit-report.json ]; then
            echo "### 📦 Dependency Audit" >> $GITHUB_STEP_SUMMARY
            TOTAL=$(cat npm-audit-report/audit-report.json | jq -r '.metadata.vulnerabilities.total // 0')
            CRITICAL=$(cat npm-audit-report/audit-report.json | jq -r '.metadata.vulnerabilities.critical // 0')
            HIGH=$(cat npm-audit-report/audit-report.json | jq -r '.metadata.vulnerabilities.high // 0')
            
            echo "- Total: $TOTAL | Critical: $CRITICAL | High: $HIGH" >> $GITHUB_STEP_SUMMARY
          fi
