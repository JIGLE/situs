name: Release

# Two-part release flow that works on a protected `main` without a RELEASE_TOKEN:
#
#   1. `prepare` (manual)  — bumps versions on a release/vX.Y.Z branch and opens a PR to
#      main. Feature branches aren't protected, so GITHUB_TOKEN can push them. A maintainer
#      merges the PR (auto-merge is attempted but is non-fatal if branch protection needs a
#      review). This is the flow that actually shipped v1.16.3.
#   2. `publish` (on push to main) — whenever a version bump lands on main and no matching
#      tag exists yet, it creates the tag and the GitHub Release; the tag push triggers deploy.
#      Tag pushes work with GITHUB_TOKEN (tags aren't branch-protected).
#
# `publish` also carries the two checks that used to live in `production.yml`: version
# integrity and release lag. They belong here rather than in a parallel workflow, because
# both are statements about the relationship between `package.json` and the newest tag —
# and only this workflow knows when that relationship is mid-flight. Running the integrity
# check in a separate workflow on the same `push: main` event was a race: on a release
# merge, `package.json` is already bumped while the tag it must match is still being
# created here. It never fired only because the other workflow put the check behind a
# build, landing it ~20 minutes after this job creates the tag in about one.
#
# There is no `release_notes` or `prerelease` input. Both were unreachable: `publish` runs
# on a different event from `prepare`, with no state carried between them, so a note typed
# at dispatch reached the release PR and never the Release itself, and `prerelease` was
# declared while the release step hardcoded `false`. Pre-release is now derived from the
# version string (any `-` suffix, e.g. `1.25.0-rc1`), and release notes are GitHub's
# generated ones — editable on the Release afterwards.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      publish_only:
        description: "Only run publish job (for recovery when version bump skipped)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Part 1: prepare the release PR (manual dispatch only) ──────────────────
  prepare:
    name: Prepare Release PR
    if: github.event_name == 'workflow_dispatch' && inputs.publish_only != true
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate new version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "${{ github.event.inputs.version_type }}" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "New version: $NEW_VERSION"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      # No verify step here. CI already ran the full trio on the PR that landed this commit,
      # and it runs again on the release/vX.Y.Z PR this job opens — a third copy gates nothing.
      # It was also the weakest of the three: it ran `npm run lint -- --max-warnings=1000`,
      # holding the release to a threshold 1000 warnings looser than the `--max-warnings=0`
      # every other path enforces.

      - name: Bump package.json version
        run: |
          npm version ${{ steps.version.outputs.new_version }} --no-git-tag-version
          npm install --package-lock-only

      - name: Sync version across manifests (with verification)
        run: |
          NEW_VER="${{ steps.version.outputs.new_version }}"

          # item.yaml (TrueNAS catalog)
          sed -i "s/^version: .*/version: ${NEW_VER}/" item.yaml
          sed -i "s/^app_version: .*/app_version: \"${NEW_VER}\"/" item.yaml
          ITEM_VER=$(grep '^version:' item.yaml | awk '{print $2}')
          if [ "$ITEM_VER" != "$NEW_VER" ]; then
            echo "::error::item.yaml version update failed (got: '$ITEM_VER', expected: '$NEW_VER')"
            exit 1
          fi

          # docker-compose.yml
          sed -i "s/NEXT_PUBLIC_APP_VERSION:.*/NEXT_PUBLIC_APP_VERSION: ${NEW_VER}/" docker-compose.yml
          DC_VER=$(grep 'NEXT_PUBLIC_APP_VERSION:' docker-compose.yml | awk '{print $2}')
          if [ "$DC_VER" != "$NEW_VER" ]; then
            echo "::error::docker-compose.yml version update failed (got: '$DC_VER', expected: '$NEW_VER')"
            exit 1
          fi

          # public/version.json — the file the running app serves and the update banner reads.
          # `prebuild` regenerates it during a build, but nothing commits that, so without this
          # the release PR lands with the file still naming the previous version. Use the repo's
          # own writer and then its own checker, rather than a third sed that could drift from
          # what `version:check` expects to see.
          npm run version:sync
          npm run version:check

          echo "All manifests verified at $NEW_VER"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %s" | head -20)
          else
            COMMITS=$(git log ${LATEST_TAG}..HEAD --oneline --pretty=format:"- %s")
          fi

          cat > release_notes.md << EOF
          ## What's Changed in v${{ steps.version.outputs.new_version }}

          $COMMITS

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG:-HEAD~10}...v${{ steps.version.outputs.new_version }}
          EOF

          cat release_notes.md

      - name: Create release branch and push
        run: |
          BRANCH="release/v${{ steps.version.outputs.new_version }}"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json item.yaml docker-compose.yml public/version.json
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.new_version }}"
          # Feature branches aren't protected — GITHUB_TOKEN can push. Force so re-runs work.
          git push --force origin "$BRANCH"

      - name: Open release PR (idempotent)
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/v${{ steps.version.outputs.new_version }}"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$EXISTING" ]; then
            echo "Release PR already open: $EXISTING"
            echo "pr_url=${EXISTING}" >> $GITHUB_OUTPUT
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): v${{ steps.version.outputs.new_version }}" \
              --body "$(cat release_notes.md)

          ---
          *Automated release PR. On merge, the \`publish\` job tags \`v${{ steps.version.outputs.new_version }}\` and cuts the GitHub Release.*" \
              --label "release")
            echo "Release PR created: $PR_URL"
            echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          fi

      - name: Try to enable auto-merge (non-fatal)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Attempt to queue an auto-merge so the release lands once checks pass. If branch
          # protection requires a human review (or the token lacks permission), this is
          # expected to fail — leave the PR for a maintainer to merge and DO NOT fail the run.
          if gh pr merge "${{ steps.open-pr.outputs.pr_url }}" --squash --auto 2>/dev/null; then
            echo "Auto-merge enabled — release will land once required checks pass."
          else
            echo "::notice::Auto-merge not available. Release PR is ready for manual merge: ${{ steps.open-pr.outputs.pr_url }}"
          fi

      - name: Summary
        run: |
          echo "## Release PR Prepared" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type**: ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR**: ${{ steps.open-pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Merge the PR to tag the release and trigger deployment." >> $GITHUB_STEP_SUMMARY

  # ── Part 2: publish tag + release when a version bump lands on main ────────
  publish:
    name: Publish Release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_only == true)
    # `contents: write` is all this needs — it pushes a tag and cuts a Release. `packages: write`
    # and `actions: write` were left over from the removed deploy-ghcr dispatch; nothing here
    # touches a package registry or another workflow any more.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENABLE_RELEASE_NOTIFY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The tag this job pushes is meant to trigger deploy-ghcr.yml (`push: tags: ["v*"]`).
          # GitHub does not start workflow runs from events created with GITHUB_TOKEN, so with the
          # default credential the tag lands and nothing builds — which is why every release image
          # so far came from a hand-dispatched deploy. A PAT restores the chain; the fallback keeps
          # this job working unchanged when RELEASE_TOKEN is not configured, in which case the
          # deploy still has to be dispatched by hand against the tag ref.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine whether this push needs a release
        id: gate
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $PKG_VERSION"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v${PKG_VERSION}" >/dev/null; then
            echo "Tag v${PKG_VERSION} already exists — nothing to publish."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "No tag for v${PKG_VERSION} yet — will publish."
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "new_version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          fi

          # Pre-release is derived, not declared. Any version carrying a suffix (1.25.0-rc1)
          # is a pre-release; a bare semver is not. The old `prerelease` dispatch input could
          # never reach this job — different trigger, no state between them — while the release
          # step below hardcoded `false`, so the input did nothing at all.
          if [[ "$PKG_VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Advisory, and deliberately on the path where nothing is published: this runs on every
      # push to main, and the interesting moment is the one where main has drifted from the
      # last release. Moved here from production.yml, which ran it behind a duplicate build.
      - name: Report release lag
        if: steps.gate.outputs.should_release != 'true'
        run: |
          LATEST_TAG=$(git tag --sort=-creatordate | grep '^v' | head -1 || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found — skipping release lag check"
            exit 0
          fi
          COMMIT_COUNT=$(git rev-list "${LATEST_TAG}..HEAD" --count)
          echo "Commits since $LATEST_TAG: $COMMIT_COUNT"
          {
            echo "## Release Lag"
            echo "Commits on \`main\` since last release (**$LATEST_TAG**): **$COMMIT_COUNT**"
          } >> $GITHUB_STEP_SUMMARY
          if [ "$COMMIT_COUNT" -gt 10 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Warning:** $COMMIT_COUNT unreleased commits on main. Consider triggering the Release workflow." >> $GITHUB_STEP_SUMMARY
            echo "::warning::$COMMIT_COUNT commits on main since $LATEST_TAG — consider cutting a release"
          fi

      - name: Create and push tag
        if: steps.gate.outputs.should_release == 'true'
        run: |
          NEW_VER="${{ steps.gate.outputs.new_version }}"
          git tag -a "v${NEW_VER}" -m "Release v${NEW_VER}"
          git push origin "v${NEW_VER}"

      # `generate_release_notes: true` and `body_path:` are not additive alternatives — the
      # action APPENDS the generated notes to whatever body it is given, so passing both put
      # two changelogs in every release. The hand-rolled `git log` step that produced
      # release_notes.md is gone; GitHub's generated notes are the single source.
      - name: Create GitHub Release
        if: steps.gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gate.outputs.new_version }}
          name: Release v${{ steps.gate.outputs.new_version }}
          draft: false
          prerelease: ${{ steps.gate.outputs.prerelease }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Moved from production.yml, and deliberately placed AFTER the tag exists. As a parallel
      # workflow on the same `push: main` event this was a race it could only lose: a release
      # merge lands the version bump first and the tag is created above, seconds to minutes
      # later. Here the invariant is checked at the one moment it is meaningful — if these
      # disagree now, a hand-edited version or a half-finished release really did leave the
      # repository inconsistent.
      - name: Verify version integrity
        if: steps.gate.outputs.should_release == 'true'
        run: |
          git fetch --tags --quiet
          PKG_VERSION=$(node -p "require('./package.json').version")
          LATEST_TAG=$(git tag --sort=-creatordate | grep '^v' | head -1 | sed 's/^v//')
          echo "package.json: $PKG_VERSION"
          echo "Latest tag:   $LATEST_TAG"
          if [ "$PKG_VERSION" != "$LATEST_TAG" ]; then
            echo "::error::Version mismatch after tagging: package.json=$PKG_VERSION, latest tag=v$LATEST_TAG"
            exit 1
          fi
          echo "Version integrity OK: $PKG_VERSION == v$LATEST_TAG"

      # No explicit deploy-ghcr dispatch here. The "Create and push tag" step above pushes
      # v<version>, and deploy-ghcr.yml already fires on `push: tags: ["v*"]` — dispatching it
      # again meant every release built and pushed the image twice, with two jobs racing to
      # write the same :latest tag. The dispatch only existed to pass deploy_k8s/kube_* inputs,
      # which no longer exist now that Kubernetes deployment has been dropped.

      - name: Release Summary
        if: steps.gate.outputs.should_release == 'true'
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ steps.gate.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify running instance of new release (optional)
        if: steps.gate.outputs.should_release == 'true' && vars.ENABLE_RELEASE_NOTIFY == 'true'
        env:
          UPDATE_WEBHOOK_SECRET: ${{ secrets.UPDATE_WEBHOOK_SECRET }}
          UPDATE_WEBHOOK_URL: ${{ secrets.UPDATE_WEBHOOK_URL }}
        run: |
          # Only run if both webhook secrets are provided
          if [ -z "$UPDATE_WEBHOOK_URL" ] || [ -z "$UPDATE_WEBHOOK_SECRET" ]; then
            echo "Webhook secrets not configured, skipping notification"
            exit 0
          fi

          PAYLOAD='{"tag_name": "v${{ steps.gate.outputs.new_version }}", "name":"v${{ steps.gate.outputs.new_version }}", "html_url": "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.gate.outputs.new_version }}" }'
          # Compute HMAC-SHA256 signature (hex) and send as X-Hub-Signature-256 header
          SIG_HEX=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$UPDATE_WEBHOOK_SECRET" -hex | sed 's/^.* //') || true
          SIG_HEADER="sha256=${SIG_HEX}"

          # Retry up to 3 times with exponential backoff
          MAX_RETRIES=3
          RETRY=0
          DELAY=5
          while [ $RETRY -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $UPDATE_WEBHOOK_SECRET" \
              -H "X-Hub-Signature-256: $SIG_HEADER" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$UPDATE_WEBHOOK_URL/api/updates" 2>/dev/null) || HTTP_CODE=0

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Webhook notification succeeded (HTTP ${HTTP_CODE})"
              break
            fi

            RETRY=$((RETRY + 1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "Webhook notification failed (HTTP ${HTTP_CODE}). Retrying in ${DELAY}s... (attempt ${RETRY}/${MAX_RETRIES})"
              sleep $DELAY
              DELAY=$((DELAY * 2))
            else
              echo "Webhook notification failed after ${MAX_RETRIES} attempts. Continuing release."
            fi
          done
