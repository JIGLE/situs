version: "3.8"

services:
  # Production deployment (from registry)
  situs-prod:
    image: ghcr.io/jigle/situs:latest
    ports:
      - "3001:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    labels:
      # No `com.truenas.app.version` here on purpose. It sat at "1.10.2" while the app shipped
      # 1.24.0 — nothing bumps a hardcoded compose label, so it can only ever drift. The image
      # already carries the real version as `org.opencontainers.image.version`, set from the
      # BUILD_VERSION build arg in the Dockerfile; that is the one source worth reading.
      com.truenas.app.name: "Situs"
      com.truenas.app.icon: "https://raw.githubusercontent.com/JIGLE/situs/main/public/situs-mark.svg"
      org.opencontainers.image.title: "Situs"
      org.opencontainers.image.description: "Sovereign Capital System — property income, receipts and tax evidence"
      org.opencontainers.image.source: "https://github.com/JIGLE/situs"
    profiles:
      - prod

  # Local development (build from source)
  situs-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: file:./dev.db

      # NextAuth Configuration
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}

      # Google OAuth (configure in Google Cloud Console)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Email Configuration (SendGrid)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@example.com}
      SENDGRID_WEBHOOK_PUBLIC_KEY: ${SENDGRID_WEBHOOK_PUBLIC_KEY:-}

      # Debug Endpoints (safe for local dev)
      DEBUG_MODE: "true"
      INIT_SECRET: ${INIT_SECRET:-dev-init-secret}

      # Application Settings
      NODE_ENV: development
      NEXT_PUBLIC_APP_VERSION: 1.25.0

    volumes:
      # Hot reload for development
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./dev.db:/app/dev.db
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s
    profiles:
      - dev

volumes:
  dev_data:

networks:
  default:
    name: situs-network
